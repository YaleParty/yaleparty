{% extends "base.html" %}

{% block title %}Log in · Grad School Party{% endblock %}

{% block content %}
<section class="auth-panel">
  <p class="eyebrow">Welcome back</p>
  <h1>Log in</h1>
  <form method="post" class="auth-form">
    {% csrf_token %}
    {{ form.as_p }}
    {% if next %}<input type="hidden" name="next" value="{{ next }}">{% endif %}
    <button class="primary-button" type="submit">Log in</button>
  </form>
  <p class="form-footnote">New here? <a href="{% url 'signup' %}">Create an account</a></p>
</section>
{% endblock %}
