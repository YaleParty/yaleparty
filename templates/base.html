{% load static %}
<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#102b3f">
  <title>{% block title %}Grad School Party{% endblock %}</title>
  <link rel="stylesheet" href="{% static 'css/site.css' %}">
</head>
<body>
  <header class="topbar">
    <a class="wordmark" href="{% url 'dashboard' %}">Grad School <span>Party</span></a>
    {% if user.is_authenticated %}
      <div class="account-actions">
        <span class="account-name">{{ user.username }}</span>
        <form method="post" action="{% url 'logout' %}">
          {% csrf_token %}
          <button class="text-button" type="submit">Log out</button>
        </form>
      </div>
    {% else %}
      <a class="text-button" href="{% url 'login' %}">Log in</a>
    {% endif %}
  </header>
  <main class="page-shell">
    {% block content %}{% endblock %}
  </main>
  <footer class="site-footer">Yale MGT 656 · Sprint 1</footer>
</body>
</html>
